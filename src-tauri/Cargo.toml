[package]
name = "playfy"
version = "25.10.8"
description = "Playfy desktop session manager"
authors = ["Bxat01"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "playfy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
discord-sdk = "0.4.0"
once_cell = "1.21.3"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"

# The default dev profile keeps full debug info for every dependency, and on
# this machine that pushed rustc past the pagefile limit (os error 1455 /
# STATUS_STACK_BUFFER_OVERRUN). Dropping debug info and incremental artifacts
# keeps codegen small; the app is unaffected.
[profile.dev]
debug = 0
incremental = false

